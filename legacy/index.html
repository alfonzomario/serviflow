  <style>
    /* Design tokens (duplicados de la config de Tailwind para uso en CSS puro) */
    :root {
      --brand: #003366;
      --brand-dark: #002244;
      --brand-light: #1d4ed8;
      --surface: #ffffff;
      --surface-muted: #f3f4f6;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
    }

    html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--surface-muted); margin: 0; color: var(--text); }
    /* Loader */
    .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid var(--brand); width: 40px; height: 40px; animation: spin 1s linear infinite; }
    .loader-small { border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 2px solid white; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Scrollbar sutil */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Quitar flechas de inputs numéricos (precio, montos) */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    
    /* Animaciones */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-in-right { animation: slideInRight 0.25s ease-out; }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 0px, #e2e8f0 200px, #f1f5f9 400px);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
      border-radius: 6px;
    }

    /* Mejoras de input (foco consistente con la marca) */
    input:focus, select:focus, textarea:focus { 
        box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.12);
    }
    
    /* Transiciones suaves */
    * { transition-property: color, background-color, border-color, transform, box-shadow; }

    /* Fade lateral en la barra de pestañas cuando hay scroll horizontal (solo mobile) */
    .tabs-scroll-fade {
      position: relative;
    }
    .tabs-scroll-fade::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 28px;
      background: linear-gradient(to left, rgba(255,255,255,1), rgba(255,255,255,0));
      pointer-events: none;
    }
    @media (min-width: 1024px) { .tabs-scroll-fade::after { display: none; } }

    /* FAB (mobile) */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 20px;
      z-index: 40;
      box-shadow: 0 10px 20px rgba(0,51,102,0.25), 0 6px 6px rgba(0,0,0,0.08);
    }
    @media (min-width: 1024px) { .fab { display: none; } }

    /* Botón marcar realizada (colores fijos para mobile / CDN Tailwind) */
    .btn-mark-realizada {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-mark-realizada:hover { background-color: #15803d; }
    .btn-mark-realizada.is-done {
      background-color: #dcfce7;
      color: #166534;
      box-shadow: inset 0 0 0 2px #86efac;
    }
    .btn-mark-realizada.is-done:hover { background-color: #bbf7d0; }
  </style>

    // --- UTILS ---
    const TZ = 'America/Argentina/Buenos_Aires';
    const BA_OFFSET = '-03:00';
    const pad2 = (n) => String(n).padStart(2, '0');

    const formatMoney = (amount) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0 }).format(amount);

    /** Mensaje corto para el usuario (sin stack trace ni JSON). */
    const formatAppError = (err, fallback = 'No se pudo completar. Intentá de nuevo.') => {
        let s = '';
        if (err == null || err === '') return fallback;
        if (typeof err === 'string') s = err;
        else if (err && err.message) s = String(err.message);
        else s = String(err);
        s = s.replace(/^Error:\s*/i, '').replace(/^Exception:\s*/i, '').trim();
        if (s.includes('AUTH_FORBIDDEN:')) return s.split('AUTH_FORBIDDEN:').pop().trim() || 'Sin permiso.';
        if (s.includes('AUTH_REQUIRED:')) return 'Sesión expirada. Volvé a entrar.';
        if (s.includes('ScriptError')) s = s.replace(/ScriptError:\s*/i, '').trim();
        s = s.split('\n').map(l => l.trim()).filter(Boolean)[0] || s;
        if (s.length > 120) s = s.slice(0, 117) + '…';
        return s || fallback;
    };

    const visitStatusToast = (status, isNew) => {
        if (status === 'CONFIRMADA') return 'Visita confirmada.';
        if (status === 'REALIZADA') return 'Visita marcada como realizada.';
        if (status === 'CANCELADA') return 'Visita cancelada.';
        if (status === 'POR_CONFIRMAR') return isNew ? 'Visita agendada (por confirmar).' : 'Visita actualizada.';
        return isNew ? 'Visita agendada.' : 'Cambios guardados.';
    };

    // Normalizar hora a HH:mm
    const formatTime24h = (value) => {
        if (value === null || value === undefined) return '09:00';
        // Date
        if (value instanceof Date && !isNaN(value.getTime())) {
            return formatTime24h(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(value));
        }
        const s = String(value).trim();
        if (!s) return '09:00';
        // Already HH:mm or HH:mm:ss
        if (s.includes(':')) {
            const [hRaw, mRaw = '00'] = s.split(':');
            const hh = String(parseInt(hRaw, 10) || 0).padStart(2, '0');
            const mm = String(parseInt(mRaw, 10) || 0).padStart(2, '0');
            return `${hh}:${mm}`;
        }
        // Digits like "930" or "0930"
        const digits = s.replace(/\D/g, '');
        if (digits.length === 4) {
            return `${digits.slice(0,2)}:${digits.slice(2,4)}`;
        }
        if (digits.length === 3) {
            return `0${digits.slice(0,1)}:${digits.slice(1,3)}`;
        }
        if (digits.length <= 2) {
            const hh = String(parseInt(digits, 10) || 9).padStart(2, '0');
            return `${hh}:00`;
        }
        return '09:00';
    };

    // Normalizar listas (p.ej. pestTypes) a array de strings
    const normalizeStringList = (value, fallbackSingle) => {
        if (Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
        if (typeof value === 'string') {
            const s = value.trim();
            if (!s) return fallbackSingle ? [String(fallbackSingle).trim()].filter(Boolean) : [];
            // si viene "A, B, C" lo separamos; si viene "A" queda como [A]
            return s.split(',').map(x => x.trim()).filter(Boolean);
        }
        if (value !== null && value !== undefined && value !== '') return [String(value).trim()].filter(Boolean);
        if (fallbackSingle !== null && fallbackSingle !== undefined && String(fallbackSingle).trim()) return [String(fallbackSingle).trim()];
        return [];
    };

    // Parse robusto a millis para createdAt (ISO o DD/MM/YYYY HH:mm)
    const toCreatedAtMillis = (createdAt) => {
        if (!createdAt) return 0;
        if (createdAt instanceof Date && !isNaN(createdAt.getTime())) return createdAt.getTime();
        const s = String(createdAt).trim();
        if (!s) return 0;
        const msIso = Date.parse(s);
        if (Number.isFinite(msIso)) return msIso;
        const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
        if (m) {
            const [, dd, mm, yyyy, hh = '0', mi = '0'] = m;
            const ms = Date.parse(`${yyyy}-${pad2(mm)}-${pad2(dd)}T${pad2(hh)}:${pad2(mi)}:00-03:00`);
            return Number.isFinite(ms) ? ms : 0;
        }
        return 0;
    };

    // Notas con auditoría: agrega una línea con el actor y timestamp
    const appendStampedNote = (existingNotes, actorLabel, actorName, comment) => {
        const base = String(existingNotes || '');
        const c = String(comment || '').trim();
        if (!c) return base;
        const stamp = new Date().toLocaleString('es-AR');
        const who = `${String(actorLabel || '').trim()} ${String(actorName || '').trim()}`.trim();
        const line = `[${who} · ${stamp}] ${c}`;
        return `${base}${base ? '\n\n' : ''}${line}`;
    };
    
    // Formatear teléfono argentino
    const formatPhone = (phone) => {
        if (!phone) return '';
        const cleaned = phone.toString().replace(/\D/g, '');
        if (cleaned.length === 10) {
            return cleaned.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
        }
        if (cleaned.length === 11) {
            return cleaned.replace(/(\d{2})(\d{4})(\d{4})(\d{1})/, '($1) $2-$3 ext. $4');
        }
        return phone;
    };
    
    // Formatear dirección con mejor presentación
    const formatAddress = (address) => {
        if (!address) return '';
        return address.split(',').map(s => s.trim()).join(', ');

    const mapsLink = (address) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address || '')}`;
    
    // --- FECHAS / HORAS (siempre Buenos Aires, un solo criterio en toda la app) ---
    const parseDateTimeParts = (value) => {
        if (value === null || value === undefined || value === '') {
            return { date: '', time: '09:00' };
        }
        if (typeof value === 'string') {
            const s = value.trim();
            if (!s) return { date: '', time: '09:00' };
            const mSlash = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
            if (mSlash) {
                const [, dd, mm, yyyy, hh, mi] = mSlash;
                return {
                    date: yyyy + '-' + pad2(mm) + '-' + pad2(dd),
                    time: formatTime24h(hh !== undefined ? hh + ':' + mi : '09:00')
                };
            }
            if (/[zZ]$/.test(s) || /[+-]\d{2}:?\d{2}$/.test(s)) {
                const ms = Date.parse(s);
                if (Number.isFinite(ms)) {
                    const inst = new Date(ms);
                    return {
                        date: new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(inst),
                        time: formatTime24h(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(inst))
                    };
                }
            }
            if (s.includes('T')) {
                const [dPart, tPart = ''] = s.split('T');
                const date = /^\d{4}-\d{2}-\d{2}/.test(dPart) ? dPart.slice(0, 10) : '';
                const time = formatTime24h(tPart.replace(/\.\d+.*$/, '').replace(/[zZ].*$/, ''));
                return { date, time };
            }
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
                return { date: s.slice(0, 10), time: '09:00' };
            }
            return { date: '', time: '09:00' };
        }
        if (value instanceof Date && !isNaN(value.getTime())) {
            return {
                date: new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(value),
                time: formatTime24h(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(value))
            };
        }
        return { date: '', time: '09:00' };
    };

    const getDatePart = (value) => parseDateTimeParts(value).date;

    const getTimePart = (value) => {
        if (value === null || value === undefined) return '09:00';
        const s = typeof value === 'string' ? value.trim() : '';
        if (s && !s.includes('T') && !s.includes('/') && /^\d{1,2}:\d{2}/.test(s)) {
            return formatTime24h(s);
        }
        return parseDateTimeParts(value).time;
    };

    const formatDate = (dateStr) => {
        const d = getDatePart(dateStr);
        if (!d) return '-';
        const [y, m, day] = d.split('-');
        if (!y || !m || !day) return '-';
        return day + '/' + m + '/' + y;
    };

    const toSortMillis = (dateValue, timeValue) => {
        const d = getDatePart(dateValue);
        if (!d) return 0;
        const t = (timeValue !== undefined && timeValue !== null && String(timeValue).trim() !== '')
            ? getTimePart(timeValue)
            : getTimePart(dateValue);
        const ms = Date.parse(d + 'T' + t + ':00' + BA_OFFSET);
        return Number.isFinite(ms) ? ms : 0;
    };

    const extractDateTime = (dateValue, timeValue) => {
        const fromDate = parseDateTimeParts(dateValue);
        const hasExplicitTime = timeValue !== undefined && timeValue !== null && String(timeValue).trim() !== '';
        const timeStr = hasExplicitTime ? getTimePart(timeValue) : fromDate.time;
        const dateStr = fromDate.date;
        return { date: dateStr, time: timeStr, iso: dateStr ? (dateStr + 'T' + timeStr + ':00') : '' };
    };

    const normalizeVisitRow = (visit) => {
        if (!visit || !visit.date) return visit;
        const dt = extractDateTime(visit.date, visit.time);
        return { ...visit, date: dt.iso || visit.date, time: dt.time || visit.time || '09:00' };
    };

    const getBuenosAiresDate = (dateStr, timeStr) => {
        const d = getDatePart(dateStr);
        const t = getTimePart(timeStr);
        return d ? (d + 'T' + t + ':00' + BA_OFFSET) : '';
    };

    const todayYmdBa = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());

    /** Mes YYYY-MM de una fecha (siempre criterio Buenos Aires). */
    const getMonthKey = (dateLike) => String(getDatePart(dateLike) || '').slice(0, 7);

    /** Fecha para guardar movimientos / ingresos de visita (con offset BA, evita saltos de mes). */
    const toFinanceStorageDate = (ymd, timeStr = '12:00') => {
        const d = getDatePart(ymd);
        if (!d) return '';
        return d + 'T' + getTimePart(timeStr) + ':00' + BA_OFFSET;
    };

    const addDaysYmd = (ymd, days) => {
        if (!ymd) return '';
        const ms = Date.parse(ymd + 'T12:00:00' + BA_OFFSET);
        if (!Number.isFinite(ms)) return '';
        return getDatePart(new Date(ms + days * 86400000));
    };

    const getDowBa = (ymd) => {
        const label = new Intl.DateTimeFormat('es-AR', { timeZone: TZ, weekday: 'long' })
            .format(new Date(Date.parse(`${ymd}T12:00:00${BA_OFFSET}`)))
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
        const map = { lunes: 0, martes: 1, miercoles: 2, jueves: 3, viernes: 4, sabado: 5, domingo: 6 };
        return map[label] ?? 0;
    };

    const getWeekOfMonth = (dateLike) => {
        const dateStr = getDatePart(dateLike);
        if (!dateStr) return 1;
        const y = Number(dateStr.slice(0, 4));
        const m = Number(dateStr.slice(5, 7));
        const d = Number(dateStr.slice(8, 10));
        if (!y || !m || !d) return 1;
        const first = new Date(y, m - 1, 1);
        const firstDay = first.getDay();
        const mondayOffset = firstDay === 0 ? 6 : firstDay - 1; // 0=lunes
        const week = Math.floor((mondayOffset + (d - 1)) / 7) + 1;
        return Math.max(1, Math.min(6, week));
    };

    const getWeeksInMonth = (dateLike) => {
        const dateStr = getDatePart(dateLike);
        if (!dateStr) return 4;
        const y = Number(dateStr.slice(0, 4));
        const m = Number(dateStr.slice(5, 7));
        if (!y || !m) return 4;
        const lastDay = new Date(y, m, 0); // último día del mes
        const weekCount = getWeekOfMonth(lastDay);
        return Math.max(4, Math.min(5, weekCount));
    };

    const getPendingItemKey = (item, targetMonth = 'current') => {
        const cid = item?.client?.id || item?.visit?.clientId || '';
        const requestId = item?.visit?.requestId || '';
        const visitId = item?.visit?.id || '';
        const app = Number(item?.applicationNumber || item?.visit?.applicationNumber || 0) || 0;
        const total = Number(item?.totalApplications || item?.visit?.totalApplications || 0) || 0;
        return [
            targetMonth,
            item?.type || '',
            cid,
            app,
            total,
            requestId,
            visitId
        ].join('|');
    };

    const visitHasFinanceValue = (v) => !v?.priceDisabled && Number(v?.price || 0) > 0;

    const buildVisitIncomeTransaction = (visit) => ({
        id: `t${Date.now()}_${visit.id}`,
        type: 'INGRESO',
        amount: Number(visit.price || 0),
        category: 'Visita',
        date: getDatePart(visit.date)
            ? toFinanceStorageDate(getDatePart(visit.date), getTimePart(visit.time || visit.date))
            : toFinanceStorageDate(todayYmdBa()),
        clientId: visit.clientId,
        visitId: visit.id,
        notes: `Pago de visita - ${visit.type || 'ESPECIAL'}`
    });

    /** Alinea ingreso en Finanzas con precio/estado de pago de la visita. Devuelve transacciones actualizadas y filas a persistir. */
    const syncVisitFinanceTransactions = (visit, transactions = []) => {
        const txs = Array.isArray(transactions) ? [...transactions] : [];
        const txsToSave = [];
        const visitId = visit?.id;
        if (!visitId) return { transactions: txs, txsToSave };

        const idx = txs.findIndex(t => t.visitId === visitId && !t.deletedAt);
        const existing = idx >= 0 ? txs[idx] : null;
        const isPaid = String(visit.paymentStatus || '').toUpperCase() === 'PAGADO';
        const shouldHaveIncome = isPaid && visitHasFinanceValue(visit);

        if (!shouldHaveIncome) {
            if (existing) {
                const updated = { ...existing, deletedAt: new Date().toISOString() };
                txs[idx] = updated;
                txsToSave.push(updated);
            }
            return { transactions: txs, txsToSave };
        }

        const amount = Number(visit.price || 0);
        const date = getDatePart(visit.date)
            ? toFinanceStorageDate(getDatePart(visit.date), getTimePart(visit.time || visit.date))
            : toFinanceStorageDate(todayYmdBa());
        if (existing) {
            const sameAmount = Number(existing.amount) === amount;
            const sameDate = (getDatePart(existing.date) || existing.date) === (getDatePart(date) || date);
            const sameClient = (existing.clientId || '') === (visit.clientId || '');
            if (!sameAmount || !sameDate || !sameClient) {
                const updated = {
                    ...existing,
                    amount,
                    date,
                    clientId: visit.clientId,
                    deletedAt: null,
                    notes: existing.notes || `Pago de visita - ${visit.type || 'ESPECIAL'}`
                };
                txs[idx] = updated;
                txsToSave.push(updated);
            }
        } else {
            const created = buildVisitIncomeTransaction(visit);
            txs.push(created);
            txsToSave.push(created);
        }
        return { transactions: txs, txsToSave };
    };

    const persistFinanceSync = (txsToSave = [], onError) => {
        txsToSave.forEach(t => {
            api.save('Transactions', t, () => {}, (e) => {
                console.error('Error sincronizando transacción:', e);
                if (onError) onError(e);
                else toastMsg.error('No se pudo sincronizar Finanzas: ' + (e?.message || e));
            });
        });
    };

    const getLastPricedVisitForClient = (visits, clientId, excludeVisitId) => {
        if (!clientId) return null;
        const list = (Array.isArray(visits) ? visits : [])
            .filter(v => !v?.deletedAt && v.clientId === clientId && v.id !== excludeVisitId && visitHasFinanceValue(v))
            .sort((a, b) => new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime());
        return list[0] || null;
    };

    /** Colores de visita en agenda (misma paleta que StatusBadge; chips y tarjetas). */
    const VISIT_STATUS_AGENDA = {

    const getAgendaVisitCardClass = (status) =>

    const readJsonLocal = (key, fallback) => {

    const SESSION_TOKEN_KEY = 'lozanor_session_token_v1';

    const writeSessionToken = (token) => {

    const filterNotDeleted = (arr) => (Array.isArray(arr) ? arr : []).filter(x => !x?.deletedAt);

    /** Estados de solicitud: PENDIENTE → AGENDADA → CERRADA (POR_CONFIRMAR en requests = legacy AGENDADA). */
    const normalizeRequestStatus = (status) => {
        const s = String(status || '').trim();
        if (s === 'POR_CONFIRMAR') return 'AGENDADA';
        return s;
    };
    const isRequestPending = (r) => String(r?.status || '').trim() === 'PENDIENTE';
    const isRequestOpenForClient = (r) => {

    const ADMIN2_SECTIONS = [
      { id: 'AGENDA', label: 'Agenda (calendario, lista, visitas)' },
      { id: 'SOLICITUDES', label: 'Solicitudes' },
      { id: 'PENDIENTES', label: 'Pendientes del mes' },
      { id: 'CLIENTES', label: 'Clientes' },
      { id: 'FINANZAS', label: 'Finanzas, precios y pagos de visitas' },
      { id: 'HISTORIAL', label: 'Historial' },
      { id: 'NOTAS', label: 'Notas y alarmas' },
      { id: 'RECOMENDADOR', label: 'Recomendador IA' }
    ];

    const parseAdmin2Permissions = (user) => {
      if (!user) return {};
      if (user.role === 'ADMIN') {
        const all = {};
        ADMIN2_SECTIONS.forEach(s => { all[s.id] = true; });
        return all;
      }
      if (user.role !== 'ADMIN2') return {};
      const out = {};
      ADMIN2_SECTIONS.forEach(s => { out[s.id] = false; });
      String(user.admin2Permissions || '').split(',').forEach(raw => {
        const k = String(raw || '').trim().toUpperCase();
        if (Object.prototype.hasOwnProperty.call(out, k)) out[k] = true;
      });
      return out;
    };

    const canAccessSection = (user, sectionId) => {
      if (!user) return false;
      if (user.role === 'ADMIN' || user.role === 'OPERATIVO') return true;
      if (user.role === 'ADMIN2') return !!parseAdmin2Permissions(user)[sectionId];
      return false;
    };

    const canWriteSection = (user, sectionId) => {
      if (user?.role === 'ADMIN') return true;
      if (user?.role === 'ADMIN2') return canAccessSection(user, sectionId);
      return false;
    };

    const mergeRowsById = (prev = [], incoming = [], idKey = 'id') => {
      const map = new Map();
      (Array.isArray(prev) ? prev : []).forEach(r => { if (r && r[idKey] != null) map.set(String(r[idKey]), r); });
      (Array.isArray(incoming) ? incoming : []).forEach(r => { if (r && r[idKey] != null) map.set(String(r[idKey]), r); });
      return Array.from(map.values());
    };

    const writeJsonLocal = (key, value) => {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {}
    };

    const getSessionVersion = (user) => String(user?.sessionVersion || '0');

    // Pendientes (misma lógica para TAB y para vista). targetMonth: 'current' | 'next' (para ver/agendar mes siguiente)
    const buildPendientesItems = (visits = [], clients = [], targetMonth = 'current') => {
        const now = new Date();
        let monthStr = (getDatePart(now) || '').slice(0, 7);
        if (targetMonth === 'next') {
            const y = now.getFullYear(), m = now.getMonth();
            const nextDate = new Date(y, m + 1, 1);
            monthStr = (getDatePart(nextDate) || '').slice(0, 7);
        }
        const currentMonth = monthStr;
        const items = [];

        const safeVisits = (Array.isArray(visits) ? visits : []).filter(v => !v?.deletedAt);
        const safeClients = Array.isArray(clients) ? clients : [];

        // 1) ABONOS del mes (y aplicaciones faltantes del mes)
        const abonosClientes = safeClients.filter(c => c.relationshipType === 'ABONO' && (c.status || 'ACTIVO') !== 'INACTIVO');
        abonosClientes.forEach(client => {
            const visitasMes = safeVisits.filter(v => {
                if (v.clientId !== client.id || v.type !== 'ABONO' || v.status === 'CANCELADA') return false;
                const m = (getDatePart(v.date) || '').slice(0, 7);
                return m === currentMonth;
            });

            if (visitasMes.some(v => v.status === 'OMITIDA_MES' && Number(v.totalApplications || 1) <= 1)) {
                return;
            }

            const visitasActivasMes = visitasMes.filter(v => v.status !== 'OMITIDA_MES');

            if (visitasActivasMes.length === 0) {
                items.push({ type: 'ABONO_MES', client, visit: null, applicationNumber: 1, totalApplications: 1, targetMonth });
                return;
            }

            // agrupar por “tratamiento” (si existe requestId, lo usamos para separar; si no, cae en el mismo grupo)
            const grupos = {};
            visitasMes.forEach(v => {
                const tot = Number(v.totalApplications || 1);
                if (tot <= 1) return;
                const key = `${client.id}|${tot}|${v.requestId || ''}`;
                if (!grupos[key]) grupos[key] = { totalApplications: tot, apps: new Set(), ref: v };
                const an = Number(v.applicationNumber || 0);
                if (an) grupos[key].apps.add(an);
            });

            Object.values(grupos).forEach(g => {
                for (let appNum = 1; appNum <= g.totalApplications; appNum++) {
                    if (!g.apps.has(appNum)) {
                        items.push({
                            type: 'ABONO_APLICACION',
                            client,
                            visit: g.ref ? { ...g.ref, applicationNumber: appNum } : null,
                            applicationNumber: appNum,
                            totalApplications: g.totalApplications,
                            targetMonth
                        });
                    }
                }
            });
        });

        // 2) ESPECIALES sin fecha (por confirmar) — solo para tratamientos de 1 aplicación.
        //    Los multi-aplicación caen en el paso 3 para que se muestren como "Aplicación N de M".
        safeVisits
            .filter(v => !v.date && v.type === 'ESPECIAL' && v.status === 'POR_CONFIRMAR' && Number(v.totalApplications || 1) === 1)
            .forEach(v => items.push({ type: 'ESPECIAL_SIN_FECHA', client: safeClients.find(c => c.id === v.clientId), visit: v, targetMonth }));

        // 3) ESPECIALES con múltiples aplicaciones: faltantes (pueden ser en meses distintos)
        const gruposEsp = {};
        safeVisits.forEach(v => {
            const tot = Number(v.totalApplications || 1);
            if (v.type !== 'ESPECIAL' || tot <= 1 || v.status === 'CANCELADA' || v.followUpClosed) return;
            const key = `${v.clientId}|${tot}|${v.requestId || ''}`;
            if (!gruposEsp[key]) gruposEsp[key] = { clientId: v.clientId, totalApplications: tot, apps: new Set(), ref: v };
            const an = Number(v.applicationNumber || 0);
            // Solo contamos como "cubierta" la aplicación si ya tiene fecha agendada.
            // Una visita POR_CONFIRMAR sin fecha (reingresada tras cancelar/eliminar) debe volver a figurar como faltante.
            if (an && v.date) gruposEsp[key].apps.add(an);
        });

        Object.values(gruposEsp).forEach(g => {
            const client = safeClients.find(c => c.id === g.clientId);
            const related = safeVisits.filter(v => {
                if (v.type !== 'ESPECIAL' || v.status === 'CANCELADA') return false;
                const sameGroup = v.clientId === g.clientId
                  && Number(v.totalApplications || 1) === g.totalApplications
                  && (v.requestId || '') === (g.ref?.requestId || '');
                return sameGroup;
            });
            const isAppCompleted = (appNum) => {
                if (g.apps.has(appNum)) return true;
                return related.some(v =>
                    Number(v.applicationNumber || 0) === appNum && v.status === 'REALIZADA' && !!v.date
                );
            };
            for (let appNum = 1; appNum <= g.totalApplications; appNum++) {
                if (isAppCompleted(appNum)) continue;
                // Solo la siguiente aplicación en secuencia (evita 2das/3ras visitas fantasma)
                if (appNum > 1 && !isAppCompleted(appNum - 1)) break;
                const prevDoneDate = related
                    .filter(v => Number(v.applicationNumber || 0) === appNum - 1 && v.status === 'REALIZADA' && !!v.date)
                    .map(v => getDatePart(v.date))
                    .filter(Boolean)
                    .sort()
                    .shift() || '';
                items.push({
                    type: 'APLICACION_FALTANTE',
                    client,
                    visit: g.ref ? { ...g.ref, applicationNumber: appNum } : null,
                    applicationNumber: appNum,
                    totalApplications: g.totalApplications,
                    lastApplicationDate: prevDoneDate,
                    targetMonth
                });
            }
        });

        // Deduplicar
        const seen = new Set();
        const unique = [];
        items.forEach(it => {
            const cid = it.client?.id || it.visit?.clientId || '';
            const key = `${it.type}|${cid}|${it.applicationNumber || ''}|${it.totalApplications || ''}|${it.visit?.requestId || ''}`;
            if (seen.has(key)) return;
            seen.add(key);
            unique.push(it);
        });

        return unique;
    };

    const visitTreatmentKey = (v) => {
        if (!v) return '';
        return `${v.clientId}|${Number(v.totalApplications || 1)}|${v.requestId || ''}`;
    };

    const getRelatedTreatmentVisits = (visit, visits = []) => {
        if (!visit || String(visit.type || '').toUpperCase() !== 'ESPECIAL') return [];
        const key = visitTreatmentKey(visit);
        return (Array.isArray(visits) ? visits : []).filter(v =>
            !v?.deletedAt &&
            String(v.type || '').toUpperCase() === 'ESPECIAL' &&
            visitTreatmentKey(v) === key
        );
    };

    const getDeleteVisitImpact = (visit, visits = []) => {
        const baseMsg = 'La visita se eliminará permanentemente y no volverá a pendientes.';
        const cancelHint = 'Si solo querés sacarla del mes o del calendario sin borrar el tratamiento, usá «Cancelar visita».';
        if (!visit) return { relatedCount: 0, message: baseMsg };
        const related = getRelatedTreatmentVisits(visit, visits).filter(v =>
            v.id !== visit.id &&
            v.status !== 'REALIZADA' &&
            v.status !== 'CANCELADA'
        );
        if (Number(visit.totalApplications || 1) <= 1 && related.length === 0) {
            return { relatedCount: 0, message: `${baseMsg} ${cancelHint}` };
        }
        if (related.length > 0) {
            return {
                relatedCount: related.length,
                message: `Se eliminarán también ${related.length} visita(s) pendiente(s) del mismo tratamiento (${visit.totalApplications || 1} aplicaciones). ${cancelHint}`
            };
        }
        return { relatedCount: 0, message: `${baseMsg} ${cancelHint}` };
    };

    // --- HOOKS & ICONS ---

    // --- TOAST SYSTEM ---
    // Sistema global de notificaciones tipo toast. Reemplaza los alert() de éxito/error más visibles.
    // Uso: toast.success("mensaje"), toast.error("mensaje"), toast.info("mensaje").
    // Exponemos un objeto singleton en window.__toast para poder usarlo desde fuera de componentes.
    const ToastContext = React.createContext(null);

    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);

      const dismiss = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      const push = React.useCallback((payload) => {
        const id = `t${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const t = { id, kind: 'info', duration: 4000, ...payload };
        setToasts(prev => [...prev, t]);
        if (t.duration > 0) {
          setTimeout(() => dismiss(id), t.duration);
        }
        return id;
      }, []);

      const api = React.useMemo(() => ({
        show: (message, opts) => push({ message, ...(opts || {}) }),
        success: (message, opts) => push({ message, kind: 'success', duration: 3500, ...(opts || {}) }),
        error: (message, opts) => push({ message, kind: 'error', duration: 6000, ...(opts || {}) }),
        info: (message, opts) => push({ message, kind: 'info', duration: 4000, ...(opts || {}) }),
        dismiss,
      }), [push]);

      // Puente global: permite llamar toast.success(...) fuera de componentes (helpers, callbacks).
      useEffect(() => { window.__toast = api; return () => { if (window.__toast === api) window.__toast = null; }; }, [api]);

      return (
        <ToastContext.Provider value={api}>
          {children}
          <Toaster toasts={toasts} onDismiss={dismiss} />
        </ToastContext.Provider>
      );
    };

    const useToast = () => React.useContext(ToastContext) || (window.__toast || { success: (m)=>alert(m), error: (m)=>alert(m), info: (m)=>alert(m), show: (m)=>alert(m), dismiss: ()=>{} });

    const Toaster = ({ toasts = [], onDismiss }) => {

    // --- CONFIRM DIALOG SYSTEM ---
    // Reemplazo de window.confirm() nativo por un modal propio con tono acorde al design system.
    // Uso: const ok = await confirmAsync({ title, message, tone: 'danger'|'default', confirmLabel, cancelLabel });
    const ConfirmContext = React.createContext(null);

    const ConfirmProvider = ({ children }) => {
      const [state, setState] = useState(null); // { title, message, tone, confirmLabel, cancelLabel, resolve }

      const confirm = React.useCallback((opts = {}) => {
        return new Promise((resolve) => {
          setState({
            title: opts.title || '¿Confirmar acción?',
            message: opts.message || '',
            tone: opts.tone === 'danger' ? 'danger' : 'default',
            confirmLabel: opts.confirmLabel || 'Confirmar',
            cancelLabel: opts.cancelLabel || 'Cancelar',
            resolve,
          });
        });
      }, []);

      const close = (ok) => {
        if (!state) return;
        state.resolve(!!ok);
        setState(null);
      };

      useEffect(() => { window.__confirmAsync = confirm; return () => { if (window.__confirmAsync === confirm) window.__confirmAsync = null; }; }, [confirm]);

      return (
        <ConfirmContext.Provider value={confirm}>
          {children}
          {state && (
            <div className="fixed inset-0 z-[90] bg-black/40 flex items-center justify-center p-4 animate-fade-in" onClick={() => close(false)}>

                    className={`flex-1 text-white font-bold py-2.5 rounded-lg shadow transition ${state.tone === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-brand hover:bg-brand-dark'}`}
                    autoFocus

                    {state.confirmLabel}
                  </button>
                </div>

                          <input className="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Nombre completo" value={regData.name} onChange={e => setRegData({...regData, name: e.target.value})} />
                          <input className="w-full border p-2.5 rounded-lg bg-gray-50" type="email" placeholder="Email (será tu usuario)" value={regData.email} onChange={e => setRegData({...regData, email: e.target.value})} />
                          <input className="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Teléfono / WhatsApp" value={regData.phone} onChange={e => setRegData({...regData, phone: e.target.value})} />
                          <input className="w-full border p-2.5 rounded-lg bg-gray-50" placeholder="Dirección exacta" value={regData.address} onChange={e => setRegData({...regData, address: e.target.value})} />
                          <input className="w-full border p-2.5 rounded-lg bg-gray-50" type="password" placeholder="Elegí un PIN (mínimo 4 dígitos)" value={regPin} onChange={e => setRegPin(e.target.value)} />
                          <button
                              onClick={handleRegisterSubmit}
                              disabled={registering}
                              className="w-full bg-blue-700 text-white py-2.5 rounded-lg font-bold shadow hover:bg-blue-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
                          >
                              {registering ? 'Creando usuario...' : 'Registrarme'}
                          </button>
                      </div>
                  </div>
              </div>
          )
      }

      return (
        <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4 font-sans relative">
          <div className="bg-white p-6 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-500 relative z-10">
            <div className="flex justify-center mb-6">
              <div className="bg-blue-100 p-4 rounded-full shadow-inner">
                <img src={APP_LOGO_DATA_URI} alt="Logo" className="w-10 h-10 object-contain" />
              </div>
            </div>
            <h2 className="text-xl font-bold text-center text-gray-800 mb-2">LOZANOR</h2>
            <p className="text-center text-gray-400 text-sm mb-6">Gestión de Fumigación y Plagas</p>
            
            {loading ? (
               <div className="flex flex-col items-center justify-center py-10">
                 <div className="loader mb-4"></div>
                 <p className="text-gray-500 text-sm animate-pulse">Cargando sistema...</p>
               </div>
            ) : error ? (
                <div className="text-center py-6">
                    <div className="text-red-500 mb-2 flex justify-center"><Icons.CloudOff size={48}/></div>
                    <p className="text-gray-800 font-bold mb-2">Error de Conexión</p>
                    <p className="text-sm text-gray-500 mb-4 bg-red-50 p-2 rounded">{error.toString()}</p>
                    <button onClick={onRetry} className="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-black">Reintentar</button>
                </div>
            ) : needsSetup ? (
               <div className="text-center">
                 <div className="bg-yellow-50 text-yellow-800 p-4 rounded-lg mb-4 text-sm border border-yellow-200">
                   <p className="font-bold flex items-center justify-center gap-2"><Icons.AlertCircle size={16}/> Base de Datos Vacía</p>
                   <p className="mt-1">Inicializá la base de datos para comenzar.</p>
                 </div>
                <button onClick={onBootstrap} className="w-full bg-brand hover:bg-brand-dark text-white py-2.5 rounded-lg font-bold shadow-lg transition-colors">
                  Crear Admin Inicial
                </button>
               </div>
            ) : (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                  <input 
                    type="email" 
                    className="w-full p-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" 
                    value={email} 
                    onChange={(e) => {
                      setEmail(e.target.value);
                      if (rememberDevice) {
                        try {
                          localStorage.setItem('lozanor_remembered_email', e.target.value);
                        } catch (err) {}
                      }
                    }}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && email && pin) {
                        if (rememberDevice && email) {
                          try {
                            localStorage.setItem('lozanor_remembered_email', email);
                          } catch (err) {}
                        }
                        onLogin(email, pin, rememberDevice);
                      }
                    }}
                    placeholder="usuario@email.com" 
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase mb-1">PIN de Acceso</label>
                  <input 
                    type="password" 
                    className="w-full p-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" 
                    value={pin} 
                    onChange={(e) => setPin(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && email && pin) {
                        if (rememberDevice && email) {
                          try {
                            localStorage.setItem('lozanor_remembered_email', email);
                          } catch (err) {}
                        }
                        onLogin(email, pin, rememberDevice);
                      }
                    }}
                    placeholder="****" 
                  />
                </div>
                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="remember-device"
                    checked={rememberDevice}
                    onChange={(e) => {
                      const checked = e.target.checked;
                      setRememberDevice(checked);
                      try {
                        localStorage.setItem('lozanor_remember_device', checked ? 'true' : 'false');
                        if (checked && email) {
                          localStorage.setItem('lozanor_remembered_email', email);
                        } else if (!checked) {
                          localStorage.removeItem('lozanor_remembered_email');
                        }
                      } catch (err) {}
                    }}
                    className="rounded border-gray-300"
                  />
                  <label htmlFor="remember-device" className="text-sm text-gray-600 cursor-pointer">
                    Mantener sesión en este dispositivo
                  </label>
                </div>
                <button onClick={() => {
                  if (rememberDevice && email) {
                    try {
                      localStorage.setItem('lozanor_remembered_email', email);
                    } catch (err) {}
                  }
                  onLogin(email, pin, rememberDevice);
                }} className="w-full bg-gray-900 text-white py-2.5 rounded-lg font-bold hover:bg-black transition-colors shadow-lg">
                  Ingresar
                </button>
                <div className="pt-4 mt-4 border-t text-center">
                    <button onClick={() => setView('REGISTER')} className="text-blue-700 font-bold text-sm hover:underline">
                        ¿Nuevo Cliente? Regístrate aquí
                    </button>
                </div>
              </div>
            )}
          </div>
          
          {/* Footer simple */}
          <div className="absolute bottom-2 left-4 text-[10px] text-gray-400">
             {needsSetup ? '⚠️ Sin inicializar' : '🔒 Iniciá sesión con email y PIN'}
          </div>
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---

    const App = () => {
      const SESSION_STORAGE_KEY = 'lozanor_session_user_v1';
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [rawDataStatus, setRawDataStatus] = useState('WAIT'); // WAIT | OK | NULL
      const [needsSetup, setNeedsSetup] = useState(false);
      const [currentUser, setCurrentUser] = useState(() => readJsonLocal(SESSION_STORAGE_KEY, null));
      const [view, setView] = useState(() => (readSessionToken() && readJsonLocal(SESSION_STORAGE_KEY, null)) ? 'DASHBOARD' : 'LOGIN');
      const [diag] = useState({ uiVersion: UI_VERSION });
      const AUTO_REFRESH_MS = 2 * 60 * 1000; // 2 min (solo si es seguro)
      
      // Asegurar que si no hay currentUser, la vista sea LOGIN
      useEffect(() => {
        if (!currentUser && view !== 'LOGIN') {
          setView('LOGIN');
        }
      }, [currentUser, view]);

      useEffect(() => {
        if (currentUser) {
          writeJsonLocal(SESSION_STORAGE_KEY, currentUser);
        } else {
          try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
        }
      }, [currentUser]);
      
      const [data, setData] = useState({ users: [], clients: [], visits: [], requests: [], transactions: [], notes: [] });

      const loadData = (silent = false, scopes = ['core', 'agenda']) => {
        const scopeList = Array.isArray(scopes) ? scopes : ['core', 'agenda'];
        // Guardar referencia al usuario actual antes de cargar
        const savedUser = currentUser;
        
        // Si no es silencioso, mostrar loading
        if (!silent) {
        setLoading(true);
        setError(null);
        setRawDataStatus('WAIT');
        }
        
        // Variable para rastrear si ya se resolvió
        let resolved = false;
        
        // Timeout de seguridad para evitar carga infinita
        const timeoutId = setTimeout(() => {
          if (!resolved && !silent) {
            resolved = true;
            console.error("Timeout en carga de datos");
            setError("La carga de datos está tardando demasiado. Por favor, intenta nuevamente.");
            setLoading(false);
            // No resetear datos si hay usuario logueado
            if (!savedUser) {
              setRawDataStatus('NULL');
            }
          }
        }, 30000); // 30 segundos
        
        api.getData(
            (res) => {
              if (resolved) return;
              resolved = true;
              clearTimeout(timeoutId);
              // apiGetDataJson(token, { scopes }) devuelve string
              let parsed = null;
              try {
                parsed = typeof res === 'string' ? JSON.parse(res) : res;
              } catch (e) {
                console.error("Error parseando JSON de getData:", e, res);
                if (!silent) setError("Error parseando datos del servidor.");
                setLoading(false);
                setRawDataStatus('NULL');
                return;
              }
              console.log("Datos recibidos del servidor:", parsed);

              // Si llega null/undefined, tratar como desconexión
              if (parsed === null || parsed === undefined) {
                  console.warn("El servidor devolvió null/undefined");

                  // Si ya tengo data cargada, NO borrarla por un null intermitente
                  const hasLocalData = Array.isArray(data?.users) && data.users.length > 0;
                  if (savedUser || hasLocalData) {
                      console.warn("Null intermitente: manteniendo datos actuales.");
                      if (!silent) {
                        setError("Conexión inestable: el servidor devolvió null. Manteniendo datos actuales.");
                      }
                      setLoading(false);
                      // Importante: NO pisar rawDataStatus si ya estaba OK
                      return;
                  }

                  // Intentar recuperar último snapshot bueno
                  try {
                    const cached = localStorage.getItem('lozanor_lastGoodData');
                    if (cached) {
                      const parsed = JSON.parse(cached);
                      if (parsed && Array.isArray(parsed.users) && parsed.users.length > 0) {
                        console.warn("Usando cache local de último estado válido.");
                        setData(parsed);
                        setRawDataStatus('OK');
                        setLoading(false);
                        return;
                      }
                    }
                  } catch (e) {
                    console.warn("No se pudo leer cache local:", e);
                  }

                  // Si no hay nada, mostrar inicialización
                  setRawDataStatus('NULL');
                  setData({ users: [], clients: [], visits: [], requests: [], transactions: [], notes: [] });
                  setLoading(false);
                  return;
              }

              // Sesión inválida / expirada
              if (parsed && typeof parsed === 'object' && parsed.__auth) {
                  console.warn("Auth error:", parsed.__error);
                  writeSessionToken('');
                  setCurrentUser(null);
                  setView('LOGIN');
                  setLoading(false);
                  if (!silent) {
                    toastMsg.error(formatAppError(parsed.__error, 'Sesión expirada. Volvé a iniciar sesión.'));
                  }
                  api.getSetupStatus((st) => setNeedsSetup(!!st.needsSetup), () => {});
                  return;
              }

              // Si el backend devolvió un error explícito, mostrarlo y no destruir data existente
              if (parsed && typeof parsed === 'object' && parsed.__error) {
                  console.warn("Backend __error:", parsed.__error);
                  if (!silent) {
                    setError(String(parsed.__error));
                  }
                  // Mantener data actual si existe
                  setLoading(false);
                  return;
              }

              setRawDataStatus('OK');
              const safeRes = parsed || {}; 
              
              // Normalizar fechas en visits
              const normalizedVisits = (Array.isArray(safeRes.visits) ? safeRes.visits : []).map(normalizeVisitRow);
              
              setData(prev => {
                const next = {
                  users: prev.users || [],
                  clients: prev.clients || [],
                  visits: prev.visits || [],
                  requests: prev.requests || [],
                  transactions: prev.transactions || [],
                  notes: prev.notes || []
                };
                if (safeRes.users !== undefined) next.users = Array.isArray(safeRes.users) ? safeRes.users : [];
                if (safeRes.clients !== undefined) next.clients = Array.isArray(safeRes.clients) ? safeRes.clients : [];
                if (safeRes.requests !== undefined) next.requests = Array.isArray(safeRes.requests) ? safeRes.requests : [];
                if (safeRes.notes !== undefined) next.notes = Array.isArray(safeRes.notes) ? safeRes.notes : [];
                if (safeRes.transactions !== undefined) {
                  next.transactions = mergeRowsById(next.transactions, Array.isArray(safeRes.transactions) ? safeRes.transactions : []);
                }
                if (safeRes.visits !== undefined) {
                  next.visits = mergeRowsById(next.visits, normalizedVisits);
                }
                if (scopeList.includes('core') && scopeList.includes('agenda')) {
                  try { localStorage.setItem('lozanor_lastGoodData', JSON.stringify(next)); } catch (e) {}
                }
                return next;
              });
              
              // Si hay usuario logueado pero ya no existe en la nueva data, mantener sesión
              if (savedUser) {
                const usersForCheck = Array.isArray(safeRes.users) ? safeRes.users : [];
                const userStillExists = usersForCheck.find(
                  u => u.id === savedUser.id || String(u.email || '').toLowerCase() === String(savedUser.email || '').toLowerCase()
                );
                if (!userStillExists) {
                  console.warn("El usuario actual ya no existe en la base de datos. Manteniendo sesión.");
                  // Mantener el usuario actual aunque no esté en la nueva data
                } else {
                  const serverSessionVersion = getSessionVersion(userStillExists);
                  const localSessionVersion = getSessionVersion(savedUser);
                  if (serverSessionVersion !== localSessionVersion) {
                    console.warn('Sesión revocada en otro dispositivo. Cerrando sesión local.');
                    if (!silent) {
                      alert('Tu sesión fue cerrada desde otro dispositivo. Volvé a iniciar sesión.');
                    }
                    writeSessionToken('');
                    setCurrentUser(null);
                    setView('LOGIN');
                    setLoading(false);
                    return;
                  }
                  // Actualizar datos del usuario si cambió
                  const updatedUser = {
                    ...userStillExists,
                    sessionVersion: serverSessionVersion,
                    admin2Permissions: userStillExists.admin2Permissions || savedUser.admin2Permissions
                  };
                  if (
                    updatedUser.id !== savedUser.id ||
                    updatedUser.name !== savedUser.name ||
                    updatedUser.role !== savedUser.role ||
                    updatedUser.email !== savedUser.email ||
                    updatedUser.admin2Permissions !== savedUser.admin2Permissions
                  ) {
                    setCurrentUser(updatedUser);
                  }
                }
              }
              
              setLoading(false);
            },
            (err) => {
              if (resolved) return;
              resolved = true;
              clearTimeout(timeoutId);
                console.error("Error cargando datos:", err);
              
              // Si hay usuario logueado, mantener datos anteriores y no resetear
              if (savedUser) {
                  console.warn("Error cargando datos pero usuario logueado. Manteniendo datos anteriores.");
                  setLoading(false);
                  setRawDataStatus('NULL');
                  // NO resetear data si hay usuario logueado
                  return;
              }
              
              // Solo resetear si no hay usuario logueado
              const msg = err?.message || err?.toString() || 'Error desconocido al cargar datos';
                setError(msg);
                setLoading(false);
              setRawDataStatus('NULL');
              setData({ users: [], clients: [], visits: [], requests: [], transactions: [], notes: [] });
            },
            { scopes: scopeList }
        );
      };

      // Auto-refresh “seguro”: solo si no hay modales abiertos y el usuario no está escribiendo
      const loadDataRef = useRef(null);
      useEffect(() => { loadDataRef.current = loadData; }, [loadData]);

      useEffect(() => {
        const isEditableFocus = () => {
          const el = document.activeElement;
          if (!el) return false;
          const tag = (el.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
          if (el.isContentEditable) return true;
          return false;
        };

        const tick = () => {
          try {
            if (view === 'LOGIN' || !currentUser) return;
            if (loading) return;
            if (document.querySelector('[data-modal="true"]')) return;
            if (isEditableFocus()) return;
            if (typeof loadDataRef.current === 'function') loadDataRef.current(true);
          } catch (e) {
            // no romper la app por auto-refresh
          }
        };

        const id = setInterval(tick, AUTO_REFRESH_MS);
        return () => clearInterval(id);
      }, [AUTO_REFRESH_MS, view, currentUser, loading]);

      useEffect(() => {
        const token = readSessionToken();
        const savedUser = readJsonLocal(SESSION_STORAGE_KEY, null);
        if (token && savedUser) {
          setCurrentUser(savedUser);
          setView('DASHBOARD');
          loadData(false);
          return;
        }
        writeSessionToken('');
        setCurrentUser(null);
        setView('LOGIN');
        setLoading(true);
        api.getSetupStatus(
          (st) => {
            setNeedsSetup(!!st.needsSetup);
            setLoading(false);
          },
          () => setLoading(false)
        );
      }, []);

      const handleLogin = (email, pin, rememberDevice = false) => {
        setLoading(true);
        setError(null);
        try {
          localStorage.setItem('lozanor_remember_device', rememberDevice ? 'true' : 'false');
        } catch (e) {}
        api.login(
          email,
          pin,
          rememberDevice,
          (res) => {
            setLoading(false);
            if (!res || !res.success) {
              alert(res?.message || 'Credenciales incorrectas. Verificá email y PIN.');
              return;
            }
            writeSessionToken(res.sessionToken);
            const user = res.user || {};
            setCurrentUser({
              ...user,
              sessionVersion: getSessionVersion(user),
              admin2Permissions: user.admin2Permissions || ''
            });
            setView('DASHBOARD');
            setNeedsSetup(false);
            loadData(false);
          },
          (err) => {
            setLoading(false);
            alert('Error al iniciar sesión: ' + (err?.message || err));
          }
        );
      };

      const handleLogout = () => {
        api.logout(() => {}, () => {});
        writeSessionToken('');
        setCurrentUser(null);
        setView('LOGIN');
        api.getSetupStatus((st) => setNeedsSetup(!!st.needsSetup), () => {});
      };

      const handleLogoutAllDevices = async () => {
        if (!currentUser) return;
        const first = await confirmAsync({
          title: '¿Cerrar sesión en todos los dispositivos?',
          message: 'Esto va a desloguear esta cuenta en cualquier celular/PC donde esté abierta.',
          tone: 'danger',
          confirmLabel: 'Continuar',
        });
        if (!first) return;
        const second = await confirmAsync({
          title: 'Confirmación final',
          message: '¿Seguro que querés cerrar sesión en todos los dispositivos ahora?',
          tone: 'danger',
          confirmLabel: 'Sí, cerrar sesión',
        });
        if (!second) return;

        const users = Array.isArray(data?.users) ? data.users : [];
        const idx = users.findIndex(u => u.id === currentUser.id || (u.email && u.email === currentUser.email));
        if (idx < 0) {
          alert('No se encontró el usuario para invalidar la sesión global.');
          handleLogout();
          return;
        }

        const revokedVersion = String(Date.now());
        const userToSave = {
          ...users[idx],
          sessionVersion: revokedVersion,
          sessionRevokedAt: new Date().toISOString()
        };

        setData(prev => {
          const safeUsers = Array.isArray(prev.users) ? prev.users : [];
          const nextUsers = safeUsers.map(u => (u.id === userToSave.id ? userToSave : u));
          return { ...prev, users: nextUsers };
        });

        api.save('Users', userToSave, () => {
          toastMsg.success('Sesión cerrada en todos los dispositivos.');
        }, (e) => {
          console.error('Error cerrando sesión global:', e);
          alert('Se cerró esta sesión local, pero hubo un error al invalidar globalmente: ' + (e?.message || e));
        });

        handleLogout();
      };

      const handleBootstrap = () => {
        const admin = { id: 'u_admin', email: 'admin@lozanor.com', pin: '1234', role: 'ADMIN', name: 'Admin Lozanor', sessionVersion: '0' };
        setLoading(true);
        api.bootstrap(admin, (res) => {
            setLoading(false);
            if (!res || !res.success) {
              alert('Error guardando Admin: ' + (res?.message || 'Error desconocido'));
              return;
            }
            setNeedsSetup(false);
            setView('LOGIN');
            alert("¡Sistema inicializado!\n\nAdmin creado:\nEmail: admin@lozanor.com\nPIN: 1234\n\nAhora podés iniciar sesión.");
        }, (e) => {
            setLoading(false);
            alert("Error guardando Admin: " + (e?.message || e));
        });
      };

      const handlePublicRegister = (info) => {
          return new Promise((resolve, reject) => {
            api.register(info, (res) => {
              if (!res || !res.success) {
                return reject(new Error(res?.message || 'No se pudo registrar.'));
              }
              resolve({ email: res.email, clientId: res.clientId });
            }, (e) => reject(new Error(e?.message || e)));
          });
      };

      const handleSaveClient = (clientData, userPin) => {
         if (!canWriteSection(currentUser, 'CLIENTES')) {
           toastMsg.info('No tenés permiso para crear/editar clientes.');
           return Promise.reject(new Error('Sin permiso'));
         }
         return new Promise((resolve, reject) => {
             // Seguridad: el PIN no debe persistirse en Clients (solo en Users)
             const { pin: _ignoredPin, ...safeClientData } = (clientData || {});
             setData(prev => {
                 const currentClients = Array.isArray(prev.clients) ? prev.clients : [];
                 const currentUsers = Array.isArray(prev.users) ? prev.users : [];
                 
                 let newClients = [...currentClients];
        const exists = newClients.findIndex(c => c.id === safeClientData.id);
                 const isNew = exists < 0;
                 
                 // Si existe, preservar campos que puedan no venir en clientData
                 if(exists >= 0) {
                     const existingClient = newClients[exists];
                     newClients[exists] = { 
                         ...existingClient, 
                        ...safeClientData,
                         // Asegurar que relationshipType se preserve si viene en clientData
                        relationshipType: safeClientData.relationshipType || existingClient.relationshipType || 'ESPECIAL'
                     };
                 } else {
                    newClients.push(safeClientData);
                 }
                 
                 let newUsers = [...currentUsers];
        const userIdx = newUsers.findIndex(u => u.clientId === safeClientData.id);
        let userData = userIdx >= 0 ? { ...newUsers[userIdx] } : { id: `u_${safeClientData.id}`, role: 'CLIENT', clientId: safeClientData.id };
        userData.email = safeClientData.email;
        userData.name = safeClientData.name;
         if(userPin) userData.pin = userPin;
         if(userIdx >= 0) newUsers[userIdx] = userData;
         else newUsers.push(userData);

                 const clientToSave = newClients[exists >= 0 ? exists : newClients.length - 1];
                 
                 // Guardar en el backend - esperar ambas operaciones
                 let clientSaved = false;
                 let userSaved = false;
                 let hasError = false;
                 
                 const checkComplete = () => {
                     if (hasError) return;
                     if (clientSaved && userSaved) {
                         console.log('Cliente y usuario guardados exitosamente');
                         resolve({ client: clientToSave, user: userData, isNew });
                     }
                 };
                 
                 api.save('Clients', clientToSave, () => {
                     clientSaved = true;
                     checkComplete();
                 }, (e) => {
                     console.error('Error guardando cliente:', e);
                     hasError = true;
                     const errorMsg = 'Error al guardar el cliente: ' + (e?.message || e);
                     toastMsg.error(errorMsg);
                     reject(new Error(errorMsg));
                 });
                 
                 api.save('Users', userData, () => {
                     userSaved = true;
                     checkComplete();
                 }, (e) => {
                     console.error('Error guardando usuario:', e);
                     hasError = true;
                     const errorMsg = 'Error al guardar el usuario: ' + (e?.message || e);
                     toastMsg.error(errorMsg);
                     reject(new Error(errorMsg));
                 });
                 
                 return { ...prev, clients: newClients, users: newUsers };
             });
         });
      };

      const handleSaveOperativo = (operativoData) => {
        if (currentUser?.role !== 'ADMIN') {
          return Promise.reject(new Error('Solo el administrador general puede gestionar fumigadores.'));
        }
        return new Promise((resolve, reject) => {
          try {
